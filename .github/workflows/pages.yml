name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_PORTFOLIO_DEMO: 'true'
      NEXT_PUBLIC_BASE_PATH: /ft-google-cloud-game-2
      NEXT_PUBLIC_URL: https://fmormah.github.io/ft-google-cloud-game-2
      NEXT_PUBLIC_SCENARIO_ASSET_BASE_URL: https://storage.googleapis.com/ft-cloud-game-2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/configure-pages@v5
      - run: node --test scripts/*.test.mjs
      - name: Unit and integration tests
        run: npm run test:ci
      - run: npm run build:pages
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Complete game journeys (desktop and mobile)
        run: npm run test:e2e
      - name: Browser test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
